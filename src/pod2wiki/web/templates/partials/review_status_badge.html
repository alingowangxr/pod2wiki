<div id="review-badge-{{ item_id }}">
    {% if status == 'accepted' %}
        <span class="badge status-completed">Accepted</span>
    {% elif status == 'rejected' %}
        <span class="badge status-failed">Rejected</span>
    {% else %}
        <span class="badge status-pending">Pending Review</span>
    {% endif %}
    {% if notes %}
        <small style="display: block; margin-top: 0.35rem;" class="muted">Note: {{ notes }}</small>
    {% endif %}
</div>

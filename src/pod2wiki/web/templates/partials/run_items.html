<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Channel</th>
            <th>Stage</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td style="font-size: 0.85rem;">{{ item.title }}</td>
            <td style="font-size: 0.85rem;">{{ item.channel }}</td>
            <td>
                <span class="badge status-{{ item.stage }}" style="font-size: 0.7rem;">{{ item.stage }}</span>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if not items %}
<p>No items recorded for this run.</p>
{% endif %}

{% extends "base.html" %}

{% block title %}Login - pod2wiki{% endblock %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <header>
        <h3>Login</h3>
    </header>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="/login" method="post">
        <label for="username">
            Username
            <input type="text" name="username" id="username" required>
        </label>
        <label for="password">
            Password
            <input type="password" name="password" id="password" required>
        </label>
        <button type="submit">Sign In</button>
    </form>
</article>

{% if not has_users %}
<article style="max-width: 400px; margin: 2rem auto; border-color: orange;">
    <header style="background: orange; color: white;">
        <strong>First Time Setup</strong>
    </header>
    <p>No users detected. Use the form above to create the first <strong>Admin</strong> account.</p>
</article>
{% endif %}
{% endblock %}

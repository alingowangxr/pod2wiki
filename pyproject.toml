[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pod2wiki"
version = "0.1.0"
description = "Turn podcasts and long-form RSS into LLM wiki source pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "httpx>=0.27.0",
  "yt-dlp>=2025.1.0",
  "youtube-transcript-api>=0.6.2",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12",
  "ruff>=0.3.0",
]

[project.scripts]
pod2wiki = "pod2wiki.cli.main:app"

[project.urls]
Homepage = "https://github.com/alingowangxr/pod2wiki"
Issues = "https://github.com/alingowangxr/pod2wiki/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"